<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="하루 한도와 이월 금액을 기록하는 가계부"
    />
    <title>AKKINO</title>
    <link rel="icon" type="image/svg+xml" href="akkino-logo.svg#app-icon" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="intro.css" />
    <script src="ledger.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <section
      id="intro-screen"
      class="onboarding-screen intro-screen"
      aria-label="AKKINO 시작"
    >
      <div class="intro-object">
        <img
          class="akkino-logo"
          src="akkino-logo.svg"
          alt="AKKINO"
          width="894"
          height="168"
          draggable="false"
          fetchpriority="high"
        />
      </div>
      <p
        id="intro-error"
        class="onboarding-error intro-error"
        role="alert"
        hidden
      ></p>
      <button
        id="intro-next"
        class="onboarding-next"
        type="button"
        aria-label="다음 화면"
      >
        <span>Next</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12h15m-6-6 6 6-6 6" />
        </svg>
      </button>
    </section>

    <section
      id="setup-screen"
      class="onboarding-screen setup-screen"
      aria-label="가계부 설정"
      hidden
    >
      <form id="setup-form" class="setup-content" novalidate>
        <div id="setup-limit-group">
          <h1 id="setup-title">하루 동안 사용할<br />한도를 정하세요.</h1>
          <label class="setup-amount" for="setup-limit">
            <span class="sr-only">하루 한도</span>
            <input
              id="setup-limit"
              type="text"
              inputmode="numeric"
              enterkeyhint="go"
              autocomplete="off"
              maxlength="22"
              placeholder="0"
              aria-describedby="setup-error"
              required
            />
            <span class="setup-unit">원</span>
          </label>
        </div>
        <div id="setup-reset-group" hidden>
          <label id="setup-reset-label" for="setup-reset-day">매월 언제 초기화할까요?</label>
          <select id="setup-reset-day" aria-describedby="setup-reset-hint setup-error" required>
            <option value="" disabled selected>날짜 선택</option>
          </select>
          <p id="setup-reset-hint">해당 날짜가 없는 달에는 말일에 초기화해요.</p>
        </div>
        <p
          id="setup-error"
          class="onboarding-error setup-error"
          role="alert"
          hidden
        ></p>
      </form>
      <button
        id="setup-next"
        class="onboarding-next"
        type="submit"
        form="setup-form"
        aria-label="설정 저장하고 시작"
        hidden
      >
        <span>Next</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12h15m-6-6 6 6-6 6" />
        </svg>
      </button>
    </section>

    <main id="ledger-screen" class="ledger" aria-label="가계부" hidden>
      <header class="ledger-header">
        <div class="date-navigation" aria-label="날짜 선택">
          <button
            type="button"
            class="icon-button"
            id="previous-day"
            aria-label="이전 날"
          >
            ‹
          </button>
          <input type="date" id="selected-date" aria-label="기록 날짜" />
          <button
            type="button"
            class="icon-button"
            id="next-day"
            aria-label="다음 날"
          >
            ›
          </button>
        </div>
        <label class="limit-field" for="daily-limit-input">
          <span>하루 한도</span>
          <span class="limit-input-wrap"
            ><input
              id="daily-limit-input"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              maxlength="22"
              aria-describedby="limit-error"
            /><span>원</span></span
          >
        </label>
      </header>
      <p
        id="limit-error"
        class="error-message limit-error"
        role="alert"
        hidden
      ></p>
      <div class="carry-line">
        <button type="button" id="today-button" class="text-button" hidden>
          오늘로
        </button>
        <p
          id="carry-info"
          title="전날 남은 금액은 더하고 초과한 금액은 차감합니다. 매월 1일에 초기화됩니다."
        >
          전일 이월 <strong id="carry-amount">0</strong><span>원</span>
        </p>
      </div>
      <p id="fatal-error" class="error-message" role="alert" hidden></p>
      <div class="table-wrap">
        <table class="ledger-table" aria-label="지출 기록">
          <colgroup>
            <col class="category-col" />
            <col class="amount-col" />
            <col />
            <col class="delete-col" />
          </colgroup>
          <thead>
            <tr>
              <th scope="col">카테고리</th>
              <th scope="col" class="amount-heading">금액 <span>(원)</span></th>
              <th scope="col">상세내용</th>
              <th scope="col"><span class="sr-only">삭제</span></th>
            </tr>
          </thead>
          <tbody id="ledger-rows"></tbody>
        </table>
      </div>
      <button
        id="add-row"
        class="add-row"
        type="button"
        aria-label="새 지출 행 추가"
        title="행 추가"
      >
        +
      </button>
      <section
        class="totals"
        aria-label="지출 합계와 남은 금액"
        aria-live="polite"
        aria-atomic="true"
      >
        <div>
          <span>지출 합계</span
          ><strong
            ><span id="spent-amount">0</span
            ><span class="unit">원</span></strong
          >
        </div>
        <div class="remaining-total">
          <span>남은 금액</span
          ><strong
            ><span id="remaining-amount">0</span
            ><span class="unit">원</span></strong
          >
        </div>
      </section>
      <footer>
        <p id="save-status" role="status">입력하면 자동 저장돼요.</p>
        <p id="reset-summary">매월 1일 이월 초기화</p>
        <button type="button" id="reset-data" class="text-button reset-data">
          데이터 초기화
        </button>
      </footer>
    </main>
  </body>
</html>
